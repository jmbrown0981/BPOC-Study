<title>TX Penal Code — Value Ladders</title>
<style>

:root{--blue:#1a3a5c;--gold:#c8a240;--light:#f0f2f5;--white:#fff;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--light);color:#222;min-height:100vh;}
header{background:var(--blue);color:#fff;padding:16px 20px;}
header h1{font-size:1.1rem;font-weight:800;}
header p{font-size:.8rem;opacity:.75;margin-top:3px;}
.search-bar{background:var(--white);border-bottom:2px solid var(--gold);padding:14px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,.1);}
.search-bar label{font-size:.82rem;font-weight:700;color:#546e7a;white-space:nowrap;}
#amount-input{padding:8px 12px;border-radius:8px;border:2px solid #b0bec5;font-size:1rem;width:160px;font-weight:700;color:var(--blue);}
#amount-input:focus{border-color:var(--blue);outline:none;}
#ch-filter{padding:7px 10px;border-radius:8px;border:2px solid #b0bec5;font-size:.85rem;color:var(--blue);background:#fff;min-width:160px;}
#ch-filter:focus{border-color:var(--blue);outline:none;}
.result-pill{font-size:.82rem;font-weight:700;padding:5px 14px;border-radius:12px;display:none;}
main{max-width:880px;margin:0 auto;padding:20px 16px 60px;}
.ch-group{margin-bottom:32px;}
.ch-group h2{font-size:.9rem;font-weight:800;color:var(--blue);border-left:4px solid var(--gold);padding-left:10px;margin-bottom:12px;letter-spacing:.03em;}
.ladder-card{background:var(--white);border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:14px;overflow:hidden;}
.ladder-header{padding:12px 16px;display:flex;align-items:baseline;gap:10px;cursor:pointer;border-bottom:1px solid #e8ecf0;}
.ladder-header:hover{background:#f8f9fc;}
.ladder-sec{font-size:.75rem;font-weight:800;background:var(--blue);color:#fff;padding:2px 8px;border-radius:8px;white-space:nowrap;}
.ladder-name{font-size:.92rem;font-weight:700;color:#1a2a3a;flex:1;}
.ladder-variant{font-size:.75rem;color:#78909c;font-style:italic;}
.ladder-hit-badge{font-size:.75rem;font-weight:800;padding:3px 10px;border-radius:10px;white-space:nowrap;display:none;}
.ladder-body{padding:14px 16px;}
.notes-box{background:#f4f6f9;border-left:3px solid var(--gold);border-radius:6px;padding:8px 12px;font-size:.78rem;color:#546e7a;line-height:1.5;margin-bottom:12px;}
.value-label{font-size:.78rem;font-weight:700;color:#78909c;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em;}
.tier-row{display:flex;gap:0;align-items:stretch;margin-bottom:5px;border-radius:8px;overflow:hidden;border:1.5px solid #e0e4ea;transition:box-shadow .15s,border-color .15s;}
.tier-row.active{border-color:#1a3a5c;box-shadow:0 0 0 2px #1a3a5c;}
.tier-grade{min-width:160px;padding:8px 12px;font-size:.8rem;font-weight:800;display:flex;align-items:center;}
.tier-range{flex:1;padding:8px 12px;font-size:.8rem;color:#455a64;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.tier-cond{font-size:.75rem;color:#78909c;font-style:italic;}
.tier-arrow{font-size:.9rem;margin-right:4px;opacity:.5;}
@media(max-width:600px){
  .tier-grade{min-width:100px;font-size:.73rem;}
  .tier-range{font-size:.75rem;}
  .ladder-name{font-size:.85rem;}
}
</style>
</head>

tent to defraud owner; or disposes of vehicle other than by transfer with intent to defraud. Sub.(b)(4) \u2014 failure to disclose vehicle location \u2014 is a separate flat Class A misdemeanor unaffected by this ladder.", "tiers": [{"grade": "State Jail Felony", "min": 0, "max": 29999.99, "label": "less than $30,000", "conditions": []}, {"grade": "Felony of the 3rd Degree", "min": 30000, "max": 149999.99, "label": "$30,000 or more but less than $150,000", "conditions": []}, {"grade": "Felony of the 2nd Degree", "min": 150000, "max": 299999.99, "label": "$150,000 or more but less than $300,000", "conditions": []}, {"grade": "Felony of the 1st Degree", "min": 300000, "max": null, "label": "$300,000 or more", "conditions": []}]}, {"sec": "32.35", "ch": "32", "name": "CREDIT CARD TRANSACTION RECORD LAUNDERING", "value_label": "amount of the record of a sale", "notes": "Standard 7-tier ladder. Applies when an authorized vendor presents a credit card transaction record for a sale not actually made by the vendor or vendor's agent, or when someone employs, solicits, or causes such conduct.", "tiers": [{"grade": "Class C Misdemeanor", "min": 0, "max": 99.99, "label": "less than $100", "conditions": []}, {"grade": "Class B Misdemeanor", "min": 100, "max": 749.99, "label": "$100 or more but less than $750", "conditions": []}, {"grade": "Class A Misdemeanor", "min": 750, "max": 2499.99, "label": "$750 or more but less than $2,500", "conditions": []}, {"grade": "State Jail Felony", "min": 2500, "max": 29999.99, "label": "$2,500 or more but less than $30,000", "conditions": []}, {"grade": "Felony of the 3rd Degree", "min": 30000, "max": 149999.99, "label": "$30,000 or more but less than $150,000", "conditions": []}, {"grade": "Felony of the 2nd Degree", "min": 150000, "max": 299999.99, "label": "$150,000 or more but less than $300,000", "conditions": []}, {"grade": "Felony of the 1st Degree", "min": 300000, "max": null, "label": "$300,000 or more", "conditions": []}]}, {"sec": "32.441", "ch": "32", "name": "ILLEGAL RECRUITMENT OF AN ATHLETE", "value_label": "value of benefit", "notes": "Standard 7-tier ladder. Applies when person solicits, accepts, or agrees to accept any benefit to influence enrollment in an institution of higher education and participation in intercollegiate athletics without consent of the governing body, or when another offers/confers such benefit.", "tiers": [{"grade": "Class C Misdemeanor", "min": 0, "max": 99.99, "label": "less than $100", "conditions": []}, {"grade": "Class B Misdemeanor", "min": 100, "max": 749.99, "label": "$100 or more but less than $750", "conditions": []}, {"grade": "Class A Misdemeanor", "min": 750, "max": 2499.99, "label": "$750 or more but less than $2,500", "conditions": []}, {"grade": "State Jail Felony", "min": 2500, "max": 29999.99, "label": "$2,500 or more but less than $30,000", "conditions": []}, {"grade": "Felony of the 3rd Degree", "min": 30000, "max": 149999.99, "label": "$30,000 or more but less than $150,000", "conditions": []}, {"grade": "Felony of the 2nd Degree", "min": 150000, "max": 299999.99, "label": "$150,000 or more but less than $300,000", "conditions": []}, {"grade": "Felony of the 1st Degree", "min": 300000, "max": null, "label": "$300,000 or more", "conditions": []}]}, {"sec": "32.45", "ch": "32", "name": "MISAPPLICATION OF FIDUCIARY PROPERTY OR PROPERTY OF FINANCIAL INSTITUTION", "value_label": "value of property misapplied", "notes": "Standard 7-tier ladder. Offenses graded by sub.(c)(1)-(6) are increased to the next higher category if shown that the offense was committed against an elderly individual as defined by \u00a722.04.", "tiers": [{"grade": "Class C Misdemeanor", "min": 0, "max": 99.99, "label": "less than $100", "conditions": []}, {"grade": "Class B Misdemeanor", "min": 100, "max": 749.99, "label": "$100 or more but less than $750", "conditions": []}, {"grade": "Class A Misdemeanor", "min": 750, "max": 2499.99, "label": "$750 or more but less than $2,500", "conditions": []}, {"grade": "State Jail Felony", "min": 2500, "max": 29999.99, "label": "$2,500 or more but less than $30,000", "conditions": []}, {"grade": "Felony of the 3rd Degree", "min": 30000, "max": 149999.99, "label": "$30,000 or more but less than $150,000", "conditions": []}, {"grade": "Felony of the 2nd Degree", "min": 150000, "max": 299999.99, "label": "$150,000 or more but less than $300,000", "conditions": []}, {"grade": "Felony of the 1st Degree", "min": 300000, "max": null, "label": "$300,000 or more", "conditions": []}]}, {"sec": "32.46", "ch": "32", "name": "FRAUDULENT SECURING OF DOCUMENT EXECUTION", "value_label": "value of property, service, or pecuniary interest", "notes": "Standard 7-tier ladder applies to sub.(a)(1) \u2014 causing another person without effective consent to sign or execute any document affecting property, service, or pecuniary interest. Sub.(a)(2) \u2014 causing a public servant without consent to file or record a purported judgment from a non-recognized court \u2014 is a flat SJF. All offenses under sub.(b)(1)-(6) and sub.(c) are enhanced one level if offense was committed against an elderly individual (\u00a722.04) or involves the state Medicaid program.", "tiers": [{"grade": "Class C Misdemeanor", "min": 0, "max": 99.99, "label": "less than $100", "conditions": []}, {"grade": "Class B Misdemeanor", "min": 100, "max": 749.99, "label": "$100 or more but less than $750", "conditions": []}, {"grade": "Class A Misdemeanor", "min": 750, "max": 2499.99, "label": "$750 or more but less than $2,500", "conditions": []}, {"grade": "State Jail Felony", "min": 2500, "max": 29999.99, "label": "$2,500 or more but less than $30,000", "conditions": []}, {"grade": "Felony of the 3rd Degree", "min": 30000, "max": 149999.99, "label": "$30,000 or more but less than $150,000", "conditions": []}, {"grade": "Felony of the 2nd Degree", "min": 150000, "max": 299999.99, "label": "$150,000 or more but less than $300,000", "conditions": []}, {"grade": "Felony of the 1st Degree", "min": 300000, "max": null, "label": "$300,000 or more", "conditions": []}]}, {"sec": "32.47", "ch": "32", "name": "FRAUDULENT DESTRUCTION, REMOVAL, OR CONCEALMENT OF WRITING", "variant": "Sub.(e) \u2014 Price Tag Swap (Writing Attached to Property to Indicate Sale Price)", "value_label": "difference between the impaired price and the lesser price indicated by the other writing", "notes": "This dollar-based ladder applies only when: (1) the writing was attached to tangible property to indicate its sale price, AND (2) the actor impaired/removed/altered that writing for the purpose of obtaining the property at a lesser price indicated by a separate writing. The general rule (Class A misdemeanor, sub.(c)) and the will/deed rule (SJF, sub.(d)) are separate non-value-based provisions.", "tiers": [{"grade": "Class C Misdemeanor", "min": 0, "max": 99.99, "label": "price difference less than $100", "conditions": []}, {"grade": "Class B Misdemeanor", "min": 100, "max": 749.99, "label": "price difference $100 or more but less than $750", "conditions": []}, {"grade": "Class A Misdemeanor", "min": 750, "max": 2499.99, "label": "price difference $750 or more but less than $2,500", "conditions": []}, {"grade": "State Jail Felony", "min": 2500, "max": 29999.99, "label": "price difference $2,500 or more but less than $30,000", "conditions": []}, {"grade": "Felony of the 3rd Degree", "min": 30000, "max": 149999.99, "label": "price difference $30,000 or more but less than $150,000", "conditions": []}, {"grade": "Felony of the 2nd Degree", "min": 150000, "max": 299999.99, "label": "price difference $150,000 or more but less than $300,000", "conditions": []}, {"grade": "Felony of the 1st Degree", "min": 300000, "max": null, "label": "price difference $300,000 or more", "conditions": []}]}, {"sec": "32.55", "ch": "32", "name": "FINANCIAL ABUSE OF ELDERLY INDIVIDUAL", "value_label": "value of property taken, appropriated, obtained, retained, or used", "notes": "6-tier ladder starting at Class B (no Class C tier). Victim must be an elderly individual (65 years of age or older per \u00a722.04). Financial abuse includes wrongful taking/appropriation/use by any means including undue influence; financial exploitation by those in a relationship of confidence or trust (parents, spouses, adult children, relatives, joint tenants, fiduciaries, financial planners, caregivers). Rebuttable presumption of wrongful transfer by caregiver if elderly individual had dementia, Alzheimer's disease, or related disorder.", "tiers": [{"grade": "Class B Misdemeanor", "min": 0, "max": 99.99, "label": "less than $100", "conditions": []}, {"grade": "Class A Misdemeanor", "min": 100, "max": 749.99, "label": "$100 or more but less than $750", "conditions": []}, {"grade": "State Jail Felony", "min": 750, "max": 2499.99, "label": "$750 or more but less than $2,500", "conditions": []}, {"grade": "Felony of the 3rd Degree", "min": 2500, "max": 29999.99, "label": "$2,500 or more but less than $30,000", "conditions": []}, {"grade": "Felony of the 2nd Degree", "min": 30000, "max": 149999.99, "label": "$30,000 or more but less than $150,000", "conditions": []}, {"grade": "Felony of the 1st Degree", "min": 150000, "max": null, "label": "$150,000 or more", "conditions": []}]}, {"sec": "32.56", "ch": "32", "name": "FINANCIAL ABUSE USING ARTIFICIALLY GENERATED MEDIA OR PHISHING", "value_label": "value of property taken, appropriated, obtained, retained, or used", "notes": "6-tier ladder starting at Class B (no Class C tier). Effective September 1, 2025 (S.B. 2373, 89th Legislature). Applies to financial abuse committed through use of artificially generated media disseminated to another person, or by deceiving/manipulating another into providing personal/financial/identifying information through email, electronic communication, or other digital means (phishing). Does not apply to interactive computer service providers, telecom services, or FCC-licensed radio/TV stations for third-party content.", "tiers": [{"grade": "Class B Misdemeanor", "min": 0, "max": 99.99, "label": "less than $100", "conditions": []}, {"grade": "Class A Misdemeanor", "min": 100, "max": 749.99, "label": "$100 or more but less than $750", "conditions": []}, {"grade": "State Jail Felony", "min": 750, "max": 2499.99, "label": "$750 or more but less than $2,500", "conditions": []}, {"grade": "Felony of the 3rd Degree", "min": 2500, "max": 29999.99, "label": "$2,500 or more but less than $30,000", "conditions": []}, {"grade": "Felony of the 2nd Degree", "min": 30000, "max": 149999.99, "label": "$30,000 or more but less than $150,000", "conditions": []}, {"grade": "Felony of the 1st Degree", "min": 150000, "max": null, "label": "$150,000 or more", "conditions": []}]}, {"sec": "32.60", "ch": "32", "name": "REAL PROPERTY FRAUD", "value_label": "market value of real property or value of interest in real property", "notes": "2-tier ladder starting at F2. Effective December 4, 2025 (S.B. 16, 89th Legislature). Applies to: (1) intentionally or knowingly making a materially false or misleading written statement to obtain real property; or (2) with intent to defraud or harm, causing another without effective consent to sign documents affecting real property, or causing a public servant without consent to file/record a purported judgment about real property title or a lien. Offense enhanced one level if owner was elderly, disabled, or a nonprofit, or if real property was subject to homestead property tax exemption under Tax Code \u00a711.13. Market value determined by appraisal roll for the tax year of the offense.", "tiers": [{"grade": "Felony of the 2nd Degree", "min": 0, "max": 299999.99, "label": "market value less than $300,000", "conditions": []}, {"grade": "Felony of the 1st Degree", "min": 300000, "max": null, "label": "market value $300,000 or more", "conditions": []}]}, {"sec": "33.02", "ch": "33", "name": "BREACH OF COMPUTER SECURITY", "variant": "Sub.(b-2) \u2014 With Intent to Defraud or Harm (Value-Based)", "value_label": "aggregate amount involved", "notes": "Sub.(a)/(b): base offense (knowing access without effective consent, no special intent) = Class B misdemeanor, elevated to SJF if 2+ prior convictions under ch.33 or if system is owned by government or critical infrastructure facility. Sub.(b-1)/(b-2) apply when actor accesses computer system with intent to defraud or harm another or to alter/damage/delete property. Additional non-dollar F2 triggers: system owned by government or critical infrastructure facility (any amount less than $300,000); or actor obtains identifying information of another from only one system. Additional non-dollar F1 trigger: actor obtains identifying information from more than one system. Aggregate amount includes direct/indirect losses and victim expenditures to investigate or restore. Amounts from multiple incidents may be aggregated.", "tiers": [{"grade": "Class C Misdemeanor", "min": 0, "max": 99.99, "label": "aggregate amount less than $100", "conditions": []}, {"grade": "Class B Misdemeanor", "min": 100, "max": 749.99, "label": "aggregate amount $100 or more but less than $750", "conditions": []}, {"grade": "Class A Misdemeanor", "min": 750, "max": 2499.99, "label": "aggregate amount $750 or more but less than $2,500", "conditions": []}, {"grade": "State Jail Felony", "min": 2500, "max": 29999.99, "label": "aggregate amount $2,500 or more but less than $30,000", "conditions": []}, {"grade": "Felony of the 3rd Degree", "min": 30000, "max": 149999.99, "label": "aggregate amount $30,000 or more but less than $150,000", "conditions": []}, {"grade": "Felony of the 2nd Degree", "min": 150000, "max": 299999.99, "label": "aggregate amount $150,000 or more but less than $300,000", "conditions": ["Aggregate amount is any amount less than $300,000 and the computer, computer network, or computer system is owned by the government or a critical infrastructure facility", "Actor obtains the identifying information of another by accessing only one computer, computer network, or computer system"]}, {"grade": "Felony of the 1st Degree", "min": 300000, "max": null, "label": "aggregate amount $300,000 or more", "conditions": ["Actor obtains the identifying information of another by accessing more than one computer, computer network, or computer system"]}]}, {"sec": "33.023", "ch": "33", "name": "ELECTRONIC DATA TAMPERING", "variant": "Sub.(d-1) \u2014 Intent to Defraud or Harm (Value-Based)", "value_label": "aggregate amount involved", "notes": "Base offense (no intent to defraud) = Class C misdemeanor. Sub.(d-1) applies when actor acted with intent to defraud or harm another. Sub.(d-2) (privileged information) is a separate variant. Covers intentionally altering data as it transmits between computers in a network, and intentionally introducing ransomware. Amounts from multiple incidents may be aggregated.", "tiers": [{"grade": "Class C Misdemeanor", "min": 0, "max": 99.99, "label": "aggregate amount less than $100 or cannot be determined", "conditions": []}, {"grade": "Class B Misdemeanor", "min": 100, "max": 749.99, "label": "aggregate amount $100 or more but less than $750", "conditions": []}, {"grade": "Class A Misdemeanor", "min": 750, "max": 2499.99, "label": "aggregate amount $750 or more but less than $2,500", "conditions": []}, {"grade": "State Jail Felony", "min": 2500, "max": 29999.99, "label": "aggregate amount $2,500 or more but less than $30,000", "conditions": []}, {"grade": "Felony of the 3rd Degree", "min": 30000, "max": 149999.99, "label": "aggregate amount $30,000 or more but less than $150,000", "conditions": []}, {"grade": "Felony of the 2nd Degree", "min": 150000, "max": 299999.99, "label": "aggregate amount $150,000 or more but less than $300,000", "conditions": []}, {"grade": "Felony of the 1st Degree", "min": 300000, "max": null, "label": "aggregate amount $300,000 or more", "conditions": []}]}, {"sec": "33.023", "ch": "33", "na var GRADE_META = {
  "Class C Misdemeanor":     {color:"#5a5a5a", bg:"#ebebeb"},
  "Class B Misdemeanor":     {color:"#6b5000", bg:"#fff3c4"},
  "Class A Misdemeanor":     {color:"#5a2d82", bg:"#ede0ff"},
  "State Jail Felony":       {color:"#1a3a5c", bg:"#d4e4f7"},
  "Felony of the 3rd Degree":{color:"#1a5c2a", bg:"#d4f7e0"},
  "Felony of the 2nd Degree":{color:"#7b3a00", bg:"#ffe5c4"},
  "Felony of the 1st Degree":{color:"#8b0000", bg:"#ffd4d4"},
  "Capital Felony":          {color:"#1a0030", bg:"#e8d0ff"},
};

var SHORT = {
  "Class C Misdemeanor":"Class C Misd.",
  "Class B Misdemeanor":"Class B Misd.",
  "Class A Misdemeanor":"Class A Misd.",
  "State Jail Felony":"SJF",
  "Felony of the 3rd Degree":"Felony 3rd",
  "Felony of the 2nd Degree":"Felony 2nd",
  "Felony of the 1st Degree":"Felony 1st",
  "Capital Felony":"Capital Felony",
};

function fmt(n){
  if(n===null) return null;
  return '$'+n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
}

function buildCards(){
  var main = document.getElementById('cards-main');
  main.innerHTML = '';
  var groups = {};
  var chOrder = [];
  LADDERS.forEach(function(L){
    if(!groups[L.ch]){groups[L.ch]=[];chOrder.push(L.ch);}
    groups[L.ch].push(L);
  });
  // sort chapters
  chOrder.sort(function(a,b){
    var na=parseInt(a.replace(/[A-Z]/g,'')), nb=parseInt(b.replace(/[A-Z]/g,''));
    if(na!==nb) return na-nb;
    return a>b?1:-1;
  });

  var CH_NAMES = {
    "28":"Ch.28 — Arson, Criminal Mischief & Property Damage",
    "31":"Ch.31 — Theft",
    "32":"Ch.32 — Fraud",
    "33":"Ch.33 — Computer Crimes",
    "33A":"Ch.33A — Telecommunications Crimes",
    "39":"Ch.39 — Abuse of Office"
  };

  chOrder.forEach(function(ch){
    var grp = document.createElement('div');
    grp.className = 'ch-group';
    grp.setAttribute('data-ch', ch);
    var h2 = document.createElement('h2');
    h2.textContent = CH_NAMES[ch] || ('Ch.'+ch);
    grp.appendChild(h2);

    groups[ch].forEach(function(L, li){
      var cardId = 'card-'+L.sec.replace(/\./g,'-')+(L.variant?'-v'+li:'');
      var card = document.createElement('div');
      card.className = 'ladder-card';
      card.setAttribute('data-sec', L.sec);
      card.setAttribute('data-ch', L.ch);

      var hdr = document.createElement('div');
      hdr.className = 'ladder-header';
      hdr.innerHTML =
        '<span class="ladder-sec">§'+L.sec+'</span>'+
        '<span class="ladder-name">'+L.name+(L.variant?' <span class="ladder-variant">('+L.variant+')</span>':'')+'</span>'+
        '<span class="ladder-hit-badge" id="badge-'+cardId+'"></span>';
      hdr.onclick = function(){
        var body = card.querySelector('.ladder-body');
        body.style.display = body.style.display==='none' ? '' : 'none';
      };
      card.appendChild(hdr);

      var body = document.createElement('div');
      body.className = 'ladder-body';

      if(L.notes){
        var nb = document.createElement('div');
        nb.className = 'notes-box';
        nb.textContent = L.notes;
        body.appendChild(nb);
      }

      var vl = document.createElement('div');
      vl.className = 'value-label';
      vl.textContent = 'Based on: ' + (L.value_label || 'value');
      body.appendChild(vl);

      L.tiers.forEach(function(t, ti){
        var meta = GRADE_META[t.grade] || {color:'#333',bg:'#f0f0f0'};
        var row = document.createElement('div');
        row.className = 'tier-row';
        row.setAttribute('data-tier', ti);
        row.setAttribute('id', 'tier-'+cardId+'-'+ti);

        var gradeEl = document.createElement('div');
        gradeEl.className = 'tier-grade';
        gradeEl.style.background = meta.bg;
        gradeEl.style.color = meta.color;
        gradeEl.textContent = SHORT[t.grade] || t.grade;

        var rangeEl = document.createElement('div');
        rangeEl.className = 'tier-range';
        var rangeText = t.label || (fmt(t.min) + (t.max !== null ? ' – '+fmt(t.max) : ' or more'));
        rangeEl.innerHTML = '<span class="tier-arrow">&#8594;</span><strong>'+rangeText+'</strong>';
        if(t.conditions && t.conditions.length){
          t.conditions.forEach(function(c){
            var span = document.createElement('span');
            span.className = 'tier-cond';
            span.textContent = '| '+c;
            rangeEl.appendChild(span);
          });
        }

        row.appendChild(gradeEl);
        row.appendChild(rangeEl);
        body.appendChild(row);
      });

      card.appendChild(body);
      grp.appendChild(card);
    });

    main.appendChild(grp);
  });
}

function highlight(amtStr){
  // Remove all active states first
  document.querySelectorAll('.tier-row').forEach(function(r){r.classList.remove('active');});
  document.querySelectorAll('.ladder-hit-badge').forEach(function(b){b.style.display='none';});

  var raw = amtStr.replace(/[$,\s]/g,'');
  if(raw==='' || isNaN(parseFloat(raw))) return;
  var amt = parseFloat(raw);

  var chFilter = document.getElementById('ch-filter').value;

  LADDERS.forEach(function(L, li){
    if(chFilter !== 'all' && L.ch !== chFilter) return;

    var cardId = 'card-'+L.sec.replace(/\./g,'-')+(L.variant?'-v'+li:'');

    // Find matching tier
    var matchTier = null;
    L.tiers.forEach(function(t, ti){
      if(amt >= t.min && (t.max === null || amt <= t.max)){
        matchTier = ti;
      }
    });
    if(matchTier === null) return;

    var tierEl = document.getElementById('tier-'+cardId+'-'+matchTier);
    if(tierEl){
      tierEl.classList.add('active');
      // Open the card body
      var body = tierEl.closest('.ladder-body');
      if(body) body.style.display = '';
    }

    var badge = document.getElementById('badge-'+cardId);
    if(badge){
      var t = L.tiers[matchTier];
      var meta = GRADE_META[t.grade] || {color:'#333',bg:'#f0f0f0'};
      badge.textContent = SHORT[t.grade] || t.grade;
      badge.style.background = meta.bg;
      badge.style.color = meta.color;
      badge.style.display = '';
    }
  });
}

function filterByChapter(){
  var ch = document.getElementById('ch-filter').value;
  document.querySelectorAll('.ch-group').forEach(function(g){
    g.style.display = (ch==='all' || g.getAttribute('data-ch')===ch) ? '' : 'none';
  });
  // Re-highlight with current amount
  highlight(document.getElementById('amount-input').value);
}

document.addEventListener('DOMContentLoaded', function(){
  buildCards();

  // Populate chapter filter
  var sel = document.getElementById('ch-filter');
  var chs = [];
  LADDERS.forEach(function(L){if(chs.indexOf(L.ch)<0) chs.push(L.ch);});
  chs.sort(function(a,b){
    var na=parseInt(a.replace(/[A-Z]/g,'')), nb=parseInt(b.replace(/[A-Z]/g,''));
    return na!==nb?na-nb:(a>b?1:-1);
  });
  var CH_NAMES2 = {
    "28":"Ch.28 — Criminal Mischief",
    "31":"Ch.31 — Theft",
    "32":"Ch.32 — Fraud",
    "33":"Ch.33 — Computer Crimes",
    "33A":"Ch.33A — Telecom Crimes",
    "39":"Ch.39 — Abuse of Office"
  };
  chs.forEach(function(ch){
    var opt = document.createElement('option');
    opt.value = ch;
    opt.textContent = CH_NAMES2[ch]||('Ch.'+ch);
    sel.appendChild(opt);
  });

  document.getElementById('amount-input').addEventListener('input', function(){
    highlight(this.value);
  });
  document.getElementById('ch-filter').addEventListener('change', filterByChapter);
});

</script>
